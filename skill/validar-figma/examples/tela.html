<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial,sans-serif;background:#F5F5F5}
.card{box-sizing:border-box;width:320px;margin:24px;padding:16px 24px;background:#FFFFFF;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:14px;line-height:24px;font-weight:700;color:#141414}
.card button{height:40px;border:0;border-radius:20px;background:#0057FF;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.card button:hover{background:#0046CC}
</style></head><body>
<div class="card" data-testid="card"><h2>Campanhas ativas</h2><button>Ver todas</button></div>
</body></html>
